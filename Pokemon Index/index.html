<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>
<body>
    <h1>Pokemon Index</h1>
    <h2>Search below any Pokemon to see Stats, Type and More!</h2>
    <section>
        <input type="text" name="gifs" id="gifs" placeholder="Search Pokemon ">
        <button name="button" type="button">Search</button>
        <h3>Name: <span id="name"></span></h3>
        <p>Type(s): <span id="type1"></span>, <span id="type2"></span></p>
        <ul>
            <li class="uppercase">STATS</li>
            <li>HP: <span id="hp"></span></li>
            <li>Attack: <span id="attack"></span></li>
            <li>Defense: <span id="defense"></span></li>
            <li>Special Attack <span id="specialAttack"></span></li>
            <li>Special Defense <span id="specialDefense"></span></li>
            <li>Speed <span id="speed"></span></li>
        </ul>
        <ul id="moveList">
            <li class="uppercase">MOVE LIST</li>
            <li id="1"></li>
            <li id="2"></li>
            <li id="3"></li>
            <li id="4"></li>
            <li id="5"></li>
            <li id="6"></li>
            <li id="7"></li>
            <li id="8"></li>
            <li id="9"></li>
            <li id="10"></li>
        </ul>
    </section>
    
    <script src="main.js"></script>
</body>
</html>
